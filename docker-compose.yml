version: '3.8'

services:
  web:
    build: .
    ports:
      - "10000:10000"
    environment:
      # Inject overriding variables
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/admitassist
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=super-secret-production-key
    depends_on:
      - db
    volumes:
      - ./backend/data:/app/backend/data  # Persist FAISS indexes locally

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=admitassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
